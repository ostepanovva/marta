# Мини-приложение Марты: https://marta.ostepanovva.ru
# Ставится скриптом deploy/install-webapp.sh отдельным файлом и другие сайты не затрагивает.

limit_req_zone $binary_remote_addr zone=marta_webapp:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name marta.ostepanovva.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name marta.ostepanovva.ru;

    ssl_certificate /etc/letsencrypt/live/marta.ostepanovva.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marta.ostepanovva.ru/privkey.pem;

    client_max_body_size 64k;

    location / {
        limit_req zone=marta_webapp burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;  # разбор текста через GigaChat может занять до минуты
    }
}
