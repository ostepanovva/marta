<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Марта</title>
<link rel="stylesheet" href="/static/app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <h1 id="title">Марта</h1>
  <button type="button" class="icon-btn" id="btn-cats" aria-label="Категории">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
  </button>
  <button type="button" class="icon-btn" id="btn-search" aria-label="Поиск">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
  </button>
  <button type="button" class="icon-btn" id="btn-settings" aria-label="Настройки">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="9.5" cy="17" r="2.2"/></svg>
  </button>
</header>

<main id="main" aria-live="polite"></main>

<button type="button" class="fab" id="fab" aria-label="Новая запись">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="toast" id="toast" role="status" hidden></div>

<nav class="tabs" aria-label="Разделы">
  <button type="button" data-tab="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.4l2.6 2.6 5-5.2"/></svg>
    <span>Сегодня</span>
  </button>
  <button type="button" data-tab="calendar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
    <span>Календарь</span>
  </button>
  <button type="button" data-tab="payments">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12.5" rx="2.5"/><path d="M3 10.5h18M7 15h4"/></svg>
    <span>Платежи</span>
  </button>
  <button type="button" data-tab="ideas">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
    <span>Идеи</span>
  </button>
  <button type="button" data-tab="shopping">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.1 10.1a1.2 1.2 0 0 0 1.2 1h8.6a1.2 1.2 0 0 0 1.2-.9L20 8H6.1"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg>
    <span>Покупки</span>
  </button>
</nav>

<div id="sheet" class="sheet-wrap" hidden>
  <button type="button" class="sheet-overlay" id="sheet-overlay" aria-label="Закрыть"></button>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <button type="button" class="icon-btn" id="sheet-back" aria-label="Назад" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="sheet-title"></h2>
      <button type="button" class="icon-btn quiet" id="sheet-close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>
</div>
</body>
</html>
